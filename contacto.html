<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://kit.fontawesome.com/e0e0cef894.js"
      crossorigin="anonymous"
    ></script>
    <link rel="icon" type="imge/x-icon" href="assets/img/dumbbell_gym_icon_124413.png">

    <title>Strivox - Contacto</title>
  </head>

  <body>
    <header>
      <nav class="navbar">
        <a href="./index.html" class="logo"
          ><i class="fa-solid fa-dumbbell"></i>Strivox</a
        >
        <ul class="nav-links">
          <li><a href="./index.html">Inicio</a></li>
          <li><a href="./planes.html">Planes</a></li>
          <li><a href="./galeria.html">Galeria</a></li>
          <li><a href="/contacto.html" class="active">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main>
        <div class="cont-title">
          <h1>Contacto</h1>
        </div>
        <section class="main-section">
        <form>
          <div class="form-group">
            <label for="name">Nombre</label>
            <input type="text" name="name" id="name" placeholder="Tu nombre" required>
          </div>

          <div class="form-group">
            <label for="surname">Apellido</label>
            <input type="text" name="surname" id="surname" placeholder="Tu apellido" required>
          </div>

          <div class="form-group">
            <label for="phone">Telefono</label>
            <input type="tel" name="phone" id="phone" placeholder="Ej: +54 11-5555-5555" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="youremail@email.com" required>
          </div>

          <div class="form-group">
            <label for="reason">Motivo de contacto</label>
            <select name="reason" id="reason">
              <option value="" disabled selected>Selecciona una opcion</option>
              <option value="inscripcion">Inscripcion</option>
              <option value="turno-spa">Turnos Spa</option>
              <option value="trabaja-con-nosotros">Trabaja con nosotros</option>
              <option value="otro">Otros</option>
            </select>
          </div>
          
          <fieldset>
            <legend>¿Sos socio de Strivox?</legend>
            <div class="radio-group">
              <div>
                <input type="radio" id="first-yes" name="first-visit" value="si" required>
                <label for="first-yes">Si</label>
              </div>
              <div>
                <input type="radio" id="first-no" name="first-visit" value="no" required>
                <label for="first-no">No</label>
              </div>
            </div>
          </fieldset>

          <div class="form-group">
            <label for="comment">Comentarios</label>
            <textarea name="comment" id="comment" placeholder="Dejanos tu comentario" required cols="40" rows="5" maxlength="1500" minlength="20"></textarea>
          </div>

          <div class="form-buttons">
            <button class="btn btn-primary" type="submit">Enviar mensaje</button>
            <button class="btn btn-primary" type="reset">Limpiar formulario</button>
          </div>

        </form>
      </section>
    </main><

    <footer>
      <ul class="footer-nav">
        <li><a href="./index.html">Inicio</a></li>
        <li><a href="./planes.html">Planes</a></li>
        <li><a href="./galeria.html">Galeria</a></li>
        <li><a href="/contacto.html">Contacto</a></li>
      </ul>
      <div class="footer-social">
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i><a>
        <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i
        ></a>
      </div>
    </footer>
  </body>
</html>
